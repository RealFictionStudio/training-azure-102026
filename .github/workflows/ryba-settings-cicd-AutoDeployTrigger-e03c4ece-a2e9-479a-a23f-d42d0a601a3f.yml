name: Trigger auto deployment for ryba-settings-cicd

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'nodejs-microservices/packages/settings-api/**'
    - '.github/workflows/ryba-settings-cicd-AutoDeployTrigger-e03c4ece-a2e9-479a-a23f-d42d0a601a3f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RYBASETTINGSCICD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RYBASETTINGSCICD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RYBASETTINGSCICD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/nodejs-microservices
          dockerfilePath: packages/settings-api/Dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: aquariumkc-h5hqd7gsfwdnf4c5.azurecr.io
          registryUsername: ${{ secrets.RYBAGATEWAYCICD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RYBAGATEWAYCICD_REGISTRY_PASSWORD }}
          containerAppName: ryba-settings-cicd
          resourceGroup: fishy-group
          imageToBuild: aquariumkc-h5hqd7gsfwdnf4c5.azurecr.io/ryba-settings-cicd:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


