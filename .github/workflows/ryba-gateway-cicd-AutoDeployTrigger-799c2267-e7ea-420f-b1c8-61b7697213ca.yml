name: Trigger auto deployment for ryba-gateway-cicd

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ryba-gateway-cicd-AutoDeployTrigger-799c2267-e7ea-420f-b1c8-61b7697213ca.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RYBAGATEWAYCICD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RYBAGATEWAYCICD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RYBAGATEWAYCICD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/nodejs-microservices
          dockerfilePath: packages/gateway-api/Dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: aquariumkc-h5hqd7gsfwdnf4c5.azurecr.io
          registryUsername: ${{ secrets.RYBAGATEWAYCICD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RYBAGATEWAYCICD_REGISTRY_PASSWORD }}
          containerAppName: ryba-gateway-cicd
          resourceGroup: fishy-group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


